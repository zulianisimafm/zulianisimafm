<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zulianisimafm.com">
    <meta property="og:title" content="Zulianisima fm - En Vivo">
    <meta property="og:description" content="Desde Cabimas ¡Tan Zuliana Como Vos!">
    <meta property="og:image" content="https://cdn.phototourl.com/free/2026-07-13-02b77484-010d-4217-8b59-cb17f900923f.jpg">
    <meta property="og:image:type" content="image/jpg">
    <meta property="og:image:width" content="600">

    <title>Zulianisima 100.3 FM ¡Tan Zuliana Como Vos!</title>
       <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
     <link rel="apple-touch-icon" href="img/logo.png" />
  
    <style>
        :root {
            --brand-blue: #001fbc;
            --brand-yellow: #fcd200;
            --brand-red: #ff0044;
            --brand-white: #ffffff;
            --bg-dark: #0d0c7c;
            --card-bg: rgba(2, 10, 42, 0.85);
            --neon-glow: rgba(252, 210, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 31, 188, 0.6) 0%, rgba(1, 6, 38, 0.95) 100%),
                radial-gradient(rgba(0, 18, 120, 0.8) 2px, transparent 2.5px);
            background-size: 100% 100%, 18px 18px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px 0 15px;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }

        .player-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* HEADER LOGO */
        .brand-header {
            text-align: center;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .logo-img {
            width: 100%;
            max-width: 360px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(252, 210, 0, 0.3));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.02);
        }

        /* TARJETA CON CARÁTULA EN TODO EL REPRODUCTOR */
        .onair-card {
            border-radius: 28px;
            padding: 35px 28px 28px 28px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 31, 188, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 520px;
            border: 1px solid rgba(252, 210, 0, 0.3);
        }

        /* IMAGEN DE FONDO ENFOCADA EN ROSTROS */
        .cover-background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%; /* Enfoca hacia la parte superior para centrar rostros */
            z-index: 0;
            transition: src 0.5s ease-in-out;
        }

        /* DEGRADADO OSCURO SOBRE LA CARÁTULA */
        .cover-gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(1, 6, 38, 0.15) 0%,
                rgba(1, 6, 38, 0.55) 50%,
                rgba(1, 6, 38, 0.98) 100%
            );
            z-index: 1;
        }

        .onair-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(252, 210, 0, 0.8), transparent, rgba(255, 0, 68, 0.8));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
        }

        /* DETALLES Y CONTROLES DEL PROGRAMA SOBRE EL DEGRADADO */
        .info-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
            width: 100%;
        }

        .live-badge {
            background: rgba(255, 0, 68, 0.95);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1.5px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
            width: fit-content;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            position: relative;
        }

        .live-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .show-title-main {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.15;
            color: #fff;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
        }

        .host-details {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .host-details i {
            color: var(--brand-yellow);
        }

        /* CONTROLES INTEGRADOS */
        .controls-wrapper {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(1, 6, 38, 0.65);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
        }

        .play-btn-main {
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-yellow), #d4b000);
            border: none;
            color: var(--bg-dark);
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--neon-glow);
            transition: all 0.3s ease;
        }

        .play-btn-main:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px var(--neon-glow);
        }

        .vol-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .vol-box input[type="range"] {
            width: 100%;
            accent-color: var(--brand-yellow);
            cursor: pointer;
        }

        .btn-icon-sub {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn-icon-sub:hover {
            opacity: 1;
            color: var(--brand-yellow);
        }

        /* ECUALIZADOR ANIMADO DE ESQUINA */
        .equalizer-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .eq-bar {
            width: 3px;
            background: var(--brand-yellow);
            border-radius: 2px;
            animation: eqAnim 1.2s infinite ease-in-out alternate;
        }

        .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.4s; }
        .eq-bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }

        @keyframes eqAnim {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* PROGRAMACIÓN HORIZONTAL */
        .schedule-box {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(252, 210, 0, 0.2);
            backdrop-filter: blur(15px);
        }

        .schedule-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .schedule-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-pills {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px;
            border-radius: 12px;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill-btn.active {
            background: var(--brand-blue);
            color: var(--brand-yellow);
        }

        .cards-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .cards-slider::-webkit-scrollbar {
            height: 6px;
        }

        .cards-slider::-webkit-scrollbar-thumb {
            background: rgba(252, 210, 0, 0.3);
            border-radius: 10px;
        }

        .prog-card-mini {
            min-width: 160px;
            width: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .prog-card-mini.active {
            background: rgba(0, 31, 188, 0.45);
            border-color: var(--brand-yellow);
            box-shadow: 0 0 15px rgba(252, 210, 0, 0.25);
        }

        .prog-card-mini img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .prog-card-mini h6 {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prog-card-mini p {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prog-time-tag {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--brand-yellow);
        }

        /* REDES SOCIALES */
        .social-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px 20px;
            border: 1px solid rgba(252, 210, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .social-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-title i {
            color: var(--brand-yellow);
        }

        .social-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-btn:hover {
            transform: translateY(-4px) scale(1.1);
            color: #fff;
        }

        .social-btn.whatsapp:hover { background: #25D366; border-color: #25D366; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }
        .social-btn.instagram:hover { background: #E1306C; border-color: #E1306C; box-shadow: 0 5px 15px rgba(225, 48, 108, 0.4); }
        .social-btn.facebook:hover { background: #1877F2; border-color: #1877F2; box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4); }
        .social-btn.tiktok:hover { background: #000; border-color: #ff0050; box-shadow: 0 5px 15px rgba(255, 0, 80, 0.4); }

        /* FOOTER */
        .site-footer {
            position: relative;
            z-index: 2;
            width: 100vw;
            background: rgba(1, 4, 18, 0.95);
            border-top: 1px solid rgba(252, 210, 0, 0.2);
            padding: 15px 0;
            text-align: center;
            margin-top: auto;
        }

        .footer-content {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .footer-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer-text strong {
            color: var(--brand-yellow);
        }

        .footer-copy {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* RESPONSIVE EN MÓVILES */
        @media (max-width: 768px) {
            #bgCanvas {
                display: none !important;
            }

            .logo-img {
                max-width: 120px;
                width: 85%;
            }

            .onair-card {
                min-height: 580px;
                padding: 20px;
            }

            .info-container {
                align-items: center;
                text-align: center;
            }

            .host-details {
                justify-content: center;
            }

            .show-title-main {
                font-size: 1.7rem;
            }

            .social-box {
                flex-direction: column;
                text-align: center;
                justify-content: center;
            }

            .schedule-nav {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .logo-img {
                max-width: 290px;
                width: 90%;
            }

            .controls-wrapper {
                flex-wrap: wrap;
                justify-content: center;
            }

            .vol-box {
                width: 100%;
                order: 2;
            }
        }
    </style>
</head>

   <header class="brand-header">

                    <button class="btn-icon-sub" onclick="reloadStream()" title="Reconectar"><i class="fas fa-sync-alt"></i></button>

                <a href="https://facebook.com/" target="_blank" class="social-btn facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://tiktok.com/" target="_blank" class="social-btn tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
            </div>
        </section>
    </div>

    <footer class="site-footer">

            <p class="footer-text"><strong>¡Tan Zuliana Como Vos!</strong></p>
            <p class="footer-text"><i class="fas fa-map-marker-alt" style="color: var(--brand-yellow);"></i> Cabimas, Estado Zulia - Venezuela</p>
            <p class="footer-copy">&copy; 2026 Zulianísima 100.3 FM - Desig by AC MEDIA BROADCAST</p>
        </div>
    </footer>

            { id: "card-cafe", inicio: 8, fin: 10, titulo: "Café con Llano", locutor: "Gladys Garcés", foto: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiiMCkKV22xm-LHd5VIokIjWq1rLkazN8nc_Bse3sSSA&s=10" },
            { id: "card-bailando", inicio: 10, fin: 12, titulo: "Bailando con Jesus y Geo", locutor: "Jesus Castellanos & Geo Garcés", foto: "https://cdn.phototourl.com/free/2026-07-11-0178fa58-f155-4297-9a2f-975af1c38a1e.jpg" },
            { id: "card-provecho", inicio: 12, fin: 14, titulo: "Buen Provecho Musical", locutor: "Jorge Acosta", foto: "https://cdn.phototourl.com/free/2026-07-11-f8c33167-d3c8-4862-9f1c-bd3e8f531734.jpg" }
        ];

        const porDefecto = { titulo: "Zulianísima 100.3 FM", locutor: "¡Tan Zuliana Como Vos!", foto: "https://cdn.phototourl.com/free/2026-07-11-bc942ae5-cb08-45f9-8367-c19d578302ff.jpg" };

        function renderCards() {
            const containerSemana = document.getElementById('sliderSemana');
            const containerFinde = document.getElementById('sliderFinde');

            containerSemana.innerHTML = progSemana.map(p => `
                <div class="prog-card-mini" id="${p.id}">
                    <img src="${p.foto}" alt="${p.titulo}">
                    <span class="prog-time-tag">${p.inicio}:00 - ${p.fin}:00</span>
                    <h6>${p.titulo}</h6>
                    <p>${p.locutor}</p>
                </div>
            `).join('');

            containerFinde.innerHTML = progFinde.map(p => `
                <div class="prog-card-mini" id="${p.id}">
                    <img src="${p.foto}" alt="${p.titulo}">
                    <span class="prog-time-tag">${p.inicio}:00 - ${p.fin}:00</span>
                    <h6>${p.titulo}</h6>
                    <p>${p.locutor}</p>
                </div>
            `).join('');
        }

        function selectTab(tab) {
            const isSemana = tab === 'semana';
            document.getElementById('pillSemana').classList.toggle('active', isSemana);
            document.getElementById('pillFinde').classList.toggle('active', !isSemana);
            document.getElementById('sliderSemana').style.display = isSemana ? 'flex' : 'none';
            document.getElementById('sliderFinde').style.display = !isSemana ? 'flex' : 'none';
        }

        function syncPlayer() {
            const ahora = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Caracas" }));
            const hora = ahora.getHours();
            const dia = ahora.getDay();
            const esFinde = (dia === 0 || dia === 6);

            if (!window.tabSet) {
                selectTab(esFinde ? 'finde' : 'semana');
                window.tabSet = true;
            }

            [...progSemana, ...progFinde].forEach(p => {
                const el = document.getElementById(p.id);
                if (el) el.classList.remove('active');
            });

            let activo = porDefecto;
            const lista = esFinde ? progFinde : progSemana;

            lista.forEach(p => {
                if (hora >= p.inicio && hora < p.fin) {
                    activo = p;
                    const el = document.getElementById(p.id);
                    if (el) el.classList.add('active');
                }
            });

            document.getElementById('currentShow').innerText = activo.titulo;
            document.getElementById('currentHost').innerText = activo.locutor;
            document.getElementById('currentPhoto').src = activo.foto;
        }

        const audio = document.getElementById('audioStream');
        const playIcon = document.getElementById('playIcon');
        let audioCtx, analyser, dataArray, isAudioInit = false;

        function initAudio() {
            if (isAudioInit) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioInit = true;
        }

        function togglePlayback() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (audio.paused) {
                audio.load();
                audio.play().then(() => playIcon.className = 'fas fa-pause');
            } else {
                audio.pause();
                playIcon.className = 'fas fa-play';
            }
        }

        function setVolume(v) { audio.volume = v; }
        function reloadStream() { audio.load(); if(!audio.paused) audio.play(); }
        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('muteIcon').className = audio.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let waveOffset = 0;
        function renderCanvas() {
            requestAnimationFrame(renderCanvas);
            
            if (window.innerWidth <= 768) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let intensity = 15;
            if (isAudioInit && !audio.paused) {
                analyser.getByteFrequencyData(dataArray);
                let avg = 0;
                for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
                intensity = (avg / dataArray.length) * 0.8 + 10;
            }

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(252, 210, 0, 0.3)';

            for (let x = 0; x < canvas.width; x += 10) {
                const y = canvas.height / 2 + Math.sin((x + waveOffset) * 0.005) * intensity * Math.cos(x * 0.002);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            waveOffset += 2;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
            syncPlayer();
            renderCanvas();
            setInterval(syncPlayer, 30000);
        });
    </script>
</body>
</html>
